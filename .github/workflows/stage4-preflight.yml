name: Stage 4 CI-to-Codex PR safety checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'event-codex/**'
      - '.github/workflows/ci-event-codex.yml'
      - '.github/workflows/stage4-preflight.yml'
permissions:
  contents: read
jobs:
  security-tests:
    name: Stage4 security and artifact tests (NO AI)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run CI identity, SHA, activation and duplicate regression checks
        run: node --test event-codex/guard.test.cjs
      - name: Run synthetic patch and adversarial regression tests
        run: python -m unittest discover -s event-codex -p 'test_security.py' -v
      - name: Audit key isolation, blocked AI job and parse YAML
        run: |
          python -m pip install 'PyYAML==6.0.3'
          python event-codex/audit.py
          python - <<'PY'
          import pathlib, yaml
          for path in pathlib.Path(".github/workflows").glob("*.yml"):
              yaml.safe_load(path.read_text())
          print("All GitHub workflow YAML files parse")
          PY
