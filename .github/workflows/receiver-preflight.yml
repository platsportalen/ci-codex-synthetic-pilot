name: Synthetic CI receiver PR validation (unpaid)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'receiver/**'
      - '.github/workflows/ci-completion-receiver.yml'
      - '.github/workflows/receiver-preflight.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: node --test receiver/*.test.cjs
