name: Portable Autodev Engine PR preflight (NO AI)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'engine/**'
      - '.github/workflows/engine-preflight.yml'
      - '.github/workflows/autodev-dispatch-smoke.yml'
permissions:
  contents: read
jobs:
  test-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: node --test engine/*.test.cjs
      - name: Confirm isolated no-secret validation
        run: echo 'Read-only task controller regression tests completed'
      - name: Parse trusted event workflow and check paid-job gates
        run: |
          python -m pip install 'PyYAML==6.0.3'
          python - <<'PY'
          from pathlib import Path
          import yaml
          wf = yaml.safe_load(Path('.github/workflows/engine-ci-event.yml').read_text())
          assert 'Synthetic CI pipeline' in Path('.github/workflows/engine-ci-event.yml').read_text()
          assert 'Autodev synthetic continuation CI' in Path('.github/workflows/engine-ci-event.yml').read_text()
          assert 'autodev-continuation-*' in Path('.github/workflows/engine-ci-event.yml').read_text()
          jobs = wf['jobs']
          assert 'reserve_paid' in jobs and 'codex_paid' in jobs and 'verify_codex_paid' in jobs
          assert "AUTODEV_PAID_V1_ENABLED == 'true'" in jobs['reserve_paid']['if']
          assert jobs['codex_paid']['environment'] == 'synthetic-pilot-approval'
          assert jobs['codex_paid']['needs'] == ['decide', 'reserve_paid']
          assert jobs['codex_paid']['permissions']['contents'] == 'read'
          assert jobs['verify_codex_paid']['needs'] == ['decide', 'codex_paid']
          assert 'environment' not in jobs['verify_codex_paid']
          assert jobs['reserve_paid']['permissions']['contents'] == 'write'
          assert jobs['integrate_patch']['needs'] == ['decide', 'codex_paid', 'verify_codex_paid']
          assert jobs['integrate_patch']['permissions']['contents'] == 'write'
          assert jobs['integrate_patch']['permissions']['actions'] == 'write'
          assert 'environment' not in jobs['integrate_patch']
          source_ci = yaml.safe_load(Path('.github/workflows/autodev-continuation-ci.yml').read_text())
          assert source_ci['jobs']['tests']['needs'] == 'validate'
          assert source_ci['jobs']['report']['needs'] == ['validate', 'tests']
          assert source_ci['jobs']['report']['permissions']['contents'] == 'write'
          assert source_ci['jobs']['next_workorder']['needs'] == 'report'
          assert 'always()' in source_ci['jobs']['next_workorder']['if']
          assert 'always()' in source_ci['jobs']['verify_direct_next']['if']
          assert source_ci['jobs']['verify_direct_next']['permissions']['contents'] == 'read'
          assert "always()" in source_ci['jobs']['direct_reserve']['if']
          assert "AUTODEV_PAID_V1_ENABLED == 'true'" in source_ci['jobs']['direct_reserve']['if']
          assert source_ci['jobs']['direct_reserve']['needs'] == ['report', 'next_workorder', 'verify_direct_next']
          assert source_ci['jobs']['direct_reserve']['permissions']['contents'] == 'write'
          assert source_ci['jobs']['direct_codex']['environment'] == 'synthetic-pilot-approval'
          assert source_ci['jobs']['direct_codex']['needs'] == ['report', 'direct_reserve']
          assert "always()" in source_ci['jobs']['direct_codex']['if']
          assert source_ci['jobs']['direct_verify_codex']['needs'] == ['report', 'direct_codex']
          assert source_ci['jobs']['direct_verify_codex']['permissions']['contents'] == 'read'
          assert source_ci['jobs']['direct_integrate']['needs'] == ['report', 'direct_codex', 'direct_verify_codex']
          assert source_ci['jobs']['direct_integrate']['permissions']['actions'] == 'write'
          assert source_ci['jobs']['direct_integrate']['permissions']['contents'] == 'write'
          for job in ['direct_reserve', 'direct_verify_codex', 'direct_integrate']:
              assert 'environment' not in source_ci['jobs'][job]
              assert 'OPENAI_API_KEY' not in str(source_ci['jobs'][job])
          assert 'secrets.OPENAI_API_KEY' in str(source_ci['jobs']['direct_codex'])
          assert 'environment' not in source_ci['jobs']['report']
          assert source_ci['jobs']['tests']['permissions']['contents'] == 'read'
          assert 'environment' not in source_ci['jobs']['tests']
          assert "secrets.OPENAI_API_KEY" not in str({
              k:v for k,v in source_ci['jobs'].items() if k != 'direct_codex'})
          smoke = yaml.safe_load(Path('.github/workflows/autodev-dispatch-smoke.yml').read_text())
          assert smoke['jobs']['dispatch']['permissions']['actions'] == 'write'
          assert smoke['jobs']['dispatch']['permissions']['contents'] == 'read'
          assert 'environment' not in smoke['jobs']['dispatch']
          assert 'OPENAI_API_KEY' not in str(smoke)
          assert "secrets.OPENAI_API_KEY" not in str(jobs['integrate_patch'])
          assert "secrets.OPENAI_API_KEY" not in str(jobs['reserve_paid'])
          assert "secrets.OPENAI_API_KEY" not in str(jobs['verify_codex_paid'])
          print('AI remains gated; key only enters isolated protected job')
          PY
